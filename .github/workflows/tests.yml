name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Only what the test suite imports (src/physics_features,
        # src/degradation_trend and tests/) — the full requirements.txt
        # pulls in streamlit/xgboost/lightgbm, which the tests never touch.
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy==2.3.2 pandas==2.3.2 scipy==1.16.1 scikit-learn==1.7.2

      - name: Run tests
        run: python -m pytest -q
